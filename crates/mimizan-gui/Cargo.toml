[package]
name = "mimizan-gui"
description = "Desktop front end for mimizan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "mimizan-gui"
path = "src/main.rs"

[dependencies]
mimizan-core = { path = "../mimizan-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc = "0.1.52"
egui = "0.36"
egui-file-dialog = "0.15"
rayon.workspace = true
image.workspace = true
# Core load in the negative panel. CPU only: no process list, no extra thread pool.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# GNOME Wayland draws no server-side frame: let winit draw the Adwaita-style
# client-side decorations itself, with the window title centred in the bar.
# macOS keeps the native frame and the system OpenGL framework.
# Windows draws with DirectX 12, which ships with the system. A virtual
# machine has no OpenGL driver, and the Store test runs in one. With a
# graphics card DirectX 12 uses it. Without one, Windows draws on the CPU.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
mimizan-mac = { path = "../mimizan-mac" }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.clippy]
all = "warn"
