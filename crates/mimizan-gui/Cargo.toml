[package]
name = "mimizan-gui"
description = "Desktop front end for mimizan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "mimizan-gui"
path = "src/main.rs"

[dependencies]
mimizan-core = { path = "../mimizan-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc = "0.1.52"
egui = "0.36"
egui-file-dialog = "0.15"
rayon.workspace = true
image.workspace = true

# GNOME Wayland draws no server-side frame: let winit draw the Adwaita-style
# client-side decorations itself, with the window title centred in the bar.
# macOS and Windows keep the native frame. Glow is the shared renderer, and
# on macOS that is the system OpenGL framework, not a library to install.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }

[lints.clippy]
all = "warn"
