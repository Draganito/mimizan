[package]
name = "mimizan-core"
description = "Bayer RAW to linear monochrome negative: luminance estimation without demosaicing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["decode-rawler"]
# RAW file decoding through `rawler` (`RawlerDecoder`, `pipeline::decode`,
# `pipeline::negative`, `kodak::binned_raw`). Mobile builds construct
# `RawFrame` from Camera2 metadata and leave this off.
decode-rawler = ["dep:rawler"]

[dependencies]
rawler = { workspace = true, optional = true }
rayon.workspace = true
rustfft.workspace = true
tiff.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
approx.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "pipeline"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
