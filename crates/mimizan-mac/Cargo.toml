[package]
name = "mimizan-mac"
description = "macOS folder grants and the App Store purchase for the sandboxed darkroom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The Mac App Store build alone: the purchase that unlocks the TIFF and the
# negative, through StoreKit 2 (swift/store.swift, compiled by build.rs).
# The download on GitHub is built without it and asks for nothing.
store = []

[dependencies]

# Only the Mac build talks to AppKit. On any other system this crate is empty.
[target.'cfg(target_os = "macos")'.dependencies]
# The default features of objc2-foundation and objc2-app-kit already
# include every class this crate names, and `block2` and `bitflags`. A
# list on top of that selects nothing.
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

[lints.clippy]
all = "warn"
