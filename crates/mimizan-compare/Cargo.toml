[package]
name = "mimizan-compare"
description = "Loupe: one Mimizan demosaic beside the other demosaics of the same file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "mimizan-compare"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
mimizan-cli = { path = "../mimizan-cli" }
mimizan-core = { path = "../mimizan-core" }
mimizan-lab-xtrans.workspace = true
rawler.workspace = true
egui.workspace = true
egui-file-dialog.workspace = true
serde_json.workspace = true
tiff.workspace = true
# TIFF for the files the tools wrote, JPEG for an embedded preview, PNG
# for a PNG chosen under All files. The workspace image crate has no TIFF.
image = { workspace = true, features = ["tiff"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["glow", "wayland", "x11", "default_fonts"] }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { workspace = true, features = ["glow", "default_fonts"] }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { workspace = true, features = ["wgpu", "default_fonts"] }

[lints.clippy]
all = "warn"
