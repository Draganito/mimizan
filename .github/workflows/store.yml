name: Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # The dist build's cache, shared with the release (see release.yml).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dist
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the store package
        shell: pwsh
        run: pwsh -NoProfile -STA -ExecutionPolicy Bypass -File ./dist/make_msix.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-store
          path: dist/mimizan-*-x64.msixupload
          if-no-files-found: error
