name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release --workspace
      # The Mac App Store window's lock, with a store that never answers.
      - name: Clippy, the store build
        run: cargo clippy --release -p mimizan-gui --features store --all-targets -- -D warnings
      - name: Tests, the store build
        run: cargo test --release -p mimizan-gui --features store
      - name: Synthetic bench (smoke)
        run: cargo run --release -p mimizan-cli -- measure synth --size 512

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release --workspace
      - name: Synthetic bench (smoke)
        run: cargo run --release -p mimizan-cli -- measure synth --size 512
      - name: No redistributable, and no console on the window
        shell: pwsh
        run: |
          cargo build --release -p mimizan-cli -p mimizan-gui -p mimizan-compare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/check_windows_exe.ps1 -Path target/release/mimizan.exe -Kind console
          & dist/check_windows_exe.ps1 -Path target/release/mimizan-gui.exe -Kind gui
          & dist/check_windows_exe.ps1 -Path target/release/mimizan-compare.exe -Kind gui

  macos:
    # Hosted macOS runners are Apple silicon. The job refuses an Intel machine.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Apple silicon
        run: |
          uname -m
          test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release --workspace
      - name: Synthetic bench (smoke)
        run: cargo run --release -p mimizan-cli -- measure synth --size 512
      - name: Window
        run: cargo build --release -p mimizan-gui
      - name: No libraries beyond macOS, and no purchase in the download
        run: |
          cargo build --release -p mimizan-compare
          bash dist/check_macos_links.sh target/release/mimizan target/release/mimizan-gui target/release/mimizan-compare
          if grep -q 'StoreKit\.framework' <<<"$(otool -L target/release/mimizan-gui)"; then
            echo "ERROR: the window built without the store feature links StoreKit"
            exit 1
          fi
      - name: App bundle starts the window
        run: |
          version=$(target/release/mimizan --version | awk '{print $2}')
          bash dist/assemble_macos_app.sh target/release/mimizan target/release/mimizan-gui "$RUNNER_TEMP/Mimizan Lab.app" "$version"
          exec=$(plutil -extract CFBundleExecutable raw "$RUNNER_TEMP/Mimizan Lab.app/Contents/Info.plist")
          test "$exec" = "mimizan-gui"
          icon=$(plutil -extract CFBundleIconFile raw "$RUNNER_TEMP/Mimizan Lab.app/Contents/Info.plist")
          test "$icon" = "AppIcon"
          test -s "$RUNNER_TEMP/Mimizan Lab.app/Contents/Resources/AppIcon.icns"
          bash dist/check_macos_links.sh \
            "$RUNNER_TEMP/Mimizan Lab.app/Contents/MacOS/mimizan" \
            "$RUNNER_TEMP/Mimizan Lab.app/Contents/MacOS/mimizan-gui"
      # Last, because it replaces the window above: the Mac App Store
      # build. Its purchase is Swift, compiled and linked here and nowhere
      # else before the store workflow runs.
      - name: The store build compiles, links and carries the purchase
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cargo clippy --release -p mimizan-gui --features store --all-targets -- -D warnings
          cargo build --release -p mimizan-gui --features store
          bash dist/check_macos_links.sh target/release/mimizan-gui
          otool -L target/release/mimizan-gui | grep -c 'StoreKit\.framework'
          nm target/release/mimizan-gui | grep -c '_mimizan_store_purchase'
